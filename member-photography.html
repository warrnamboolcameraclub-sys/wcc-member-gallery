<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Photography | Warrnambool Camera Club</title>

  <script>
    (function () {
      var mobileGallery = "https://warrnamboolcameraclub-sys.github.io/wcc-member-gallery/";
      var desktopGallery = "https://warrnamboolcameraclub.zenfolio.com/member-photography";

      if (window.matchMedia("(max-width: 768px)").matches) {
        window.location.replace(mobileGallery);
      } else {
        window.location.replace(desktopGallery);
      }
    }());
  </script>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0d10;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 28px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #111820;
      border-top: 5px solid #2f54d4;
      padding: 30px 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 20px 0;
      color: #c7d0d8;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    a {
      display: inline-block;
      padding: 12px 16px;
      text-decoration: none;
      font-weight: 700;
      color: #ffffff;
      background: #1f4568;
    }

    a.primary {
      background: #d71920;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Member Photography</h1>
      <p>You should be redirected automatically. If not, choose the version you want to open.</p>

      <div class="buttons">
        <a class="primary"
           href="https://warrnamboolcameraclub-sys.github.io/wcc-member-gallery/">
          Mobile Gallery
        </a>

        <a href="https://warrnamboolcameraclub.zenfolio.com/member-photography">
          Desktop Gallery
        </a>
      </div>

      <noscript>
        <p style="margin-top:20px;">
          Automatic device detection requires JavaScript. Please use one of the links above.
        </p>
      </noscript>
    </div>
  </div>
</body>
</html>
